openapi: 3.1.0
info:
  title: POS SaaS API
  version: 1.0.0
  description: API v1 contract for POS auth, catalog, sales, KDS, QR ordering, and offline sync.
servers:
  - url: /api/v1
paths:
  /pos/auth/login:
    post:
      operationId: issuePosToken
      summary: Issue a POS device token
      tags:
        - POS Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - installation_id
                - outlet_id
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                installation_id:
                  $ref: '#/components/schemas/Ulid'
                outlet_id:
                  $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: POS token issued for the active user-device-outlet context.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/auth/logout:
    post:
      operationId: revokeCurrentPosToken
      summary: Revoke the current POS token
      tags:
        - POS Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current token revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: boolean
        '401':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/context:
    get:
      operationId: resolvePosOutletContext
      summary: Resolve the authenticated POS outlet context
      tags:
        - POS Context
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Active outlet context bound to the current POS token.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosOutletContextResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/catalog:
    get:
      operationId: listAvailableOutletCatalog
      summary: List available catalog products for the authenticated POS outlet
      tags:
        - POS Catalog
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Active and available products for the outlet context.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletCatalogResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/current:
    get:
      operationId: getCurrentShift
      summary: Get the current open shift for the authenticated POS user and outlet
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Current open shift, or null when no shift is open.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/open:
    post:
      operationId: openShift
      summary: Open a shift for the authenticated POS user and outlet
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - opening_cash_minor
              properties:
                opening_cash_minor:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Shift opened.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/{shift}/close:
    post:
      operationId: closeShift
      summary: Close an open shift
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: shift
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - closing_cash_minor
              properties:
                closing_cash_minor:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Shift closed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/{shift}/summary:
    get:
      operationId: getShiftSummary
      summary: Get reconciled sales and cash summary for a POS shift
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: shift
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Shift summary based on completed orders and recorded payments.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSummaryResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders:
    post:
      operationId: createDraftOrder
      summary: Create an idempotent draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '201':
          description: Draft order created or replayed for the same idempotency key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}:
    get:
      operationId: getDraftOrder
      summary: Get a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Draft order with item snapshots and current totals.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/items:
    post:
      operationId: addDraftOrderItem
      summary: Add an item snapshot to a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemInput'
      responses:
        '200':
          description: Draft order after item addition and total recalculation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/items/{item}:
    put:
      operationId: updateDraftOrderItem
      summary: Update an item quantity on a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: item
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: string
                  pattern: '^\d+(\.\d{1,3})?$'
      responses:
        '200':
          description: Draft order after item update and total recalculation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeDraftOrderItem
      summary: Remove an item from a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: item
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Draft order after item removal and total recalculation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/complete:
    post:
      operationId: completeOrderWithPayment
      summary: Complete a draft POS order with exact payment
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - amount_minor
                - currency
              properties:
                method:
                  type: string
                  enum:
                    - cash
                    - manual_non_cash
                amount_minor:
                  type: integer
                  minimum: 0
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
      responses:
        '200':
          description: Order completed with one recorded full payment, or replayed for the same idempotency key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/cancel:
    post:
      operationId: cancelDraftOrder
      summary: Cancel a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: Draft order cancelled, or replayed for the same idempotency key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/receipt:
    get:
      operationId: getOrderReceipt
      summary: Get the immutable receipt snapshot for a completed POS order
      tags:
        - POS Receipts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Receipt snapshot generated at order completion.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/{shift}/cash-movements:
    post:
      operationId: recordCashMovement
      summary: Record a cash drawer movement for an open shift
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: shift
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - amount_minor
                - currency
                - reason
              properties:
                type:
                  type: string
                  enum:
                    - cash_in
                    - cash_out
                amount_minor:
                  type: integer
                  minimum: 1
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                approval_id:
                  oneOf:
                    - $ref: '#/components/schemas/Ulid'
                    - type: 'null'
      responses:
        '201':
          description: Cash movement recorded or replayed for the same idempotency key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashMovementResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/void:
    post:
      operationId: voidCompletedOrder
      summary: Void a completed POS order with approval
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
                - approval_id
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                approval_id:
                  $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Completed order voided, or replayed for the same idempotency key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/refund:
    post:
      operationId: recordFullRefund
      summary: Record a full manual refund for a completed order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount_minor
                - currency
                - reason
                - approval_id
              properties:
                amount_minor:
                  type: integer
                  minimum: 0
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                approval_id:
                  $ref: '#/components/schemas/Ulid'
      responses:
        '201':
          description: Full refund recorded, or replayed for the same idempotency key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/kds/snapshot:
    get:
      operationId: getKdsSnapshot
      summary: Get current kitchen display snapshot for an outlet
      tags:
        - POS Kitchen
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: station_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Current active kitchen tickets and station-filtered items.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KdsSnapshotResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /qr/{token}:
    get:
      operationId: getPublicQrCatalog
      summary: Get public QR ordering catalog from a signed opaque token
      tags:
        - QR Ordering
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Public QR session and available outlet catalog.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQrCatalogResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/sync/bootstrap:
    get:
      operationId: getSyncBootstrapPolicy
      summary: Get offline sync retention and trust policy for a POS device
      tags:
        - POS Sync
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Device-specific offline sync policy.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBootstrapResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/sync/catalog-snapshot:
    get:
      operationId: getOfflineCatalogSnapshot
      summary: Get versioned outlet catalog snapshot for offline read
      tags:
        - POS Sync
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Versioned catalog snapshot and cache retention policy.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineCatalogSnapshotResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/sync/push:
    post:
      operationId: pushSyncMutation
      summary: Push one idempotent offline mutation from a POS device
      tags:
        - POS Sync
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncMutationInput'
      responses:
        '200':
          description: Duplicate, rejected, or conflict result.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMutationResponse'
        '202':
          description: Mutation accepted for server-authoritative processing.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMutationResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/sync/pull:
    get:
      operationId: pullSyncOutbox
      summary: Pull server outbox records for the authenticated POS device
      tags:
        - POS Sync
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: after_cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Outbox records after the requested cursor.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncOutboxResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    RequestId:
      description: Request correlation ID generated by the API or echoed from X-Request-ID.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details error response.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9a-hjkmnp-tv-z]{26}$'
    PosTokenResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - access_token
            - token_type
            - expires_at
            - tenant_id
            - outlet_id
            - device_id
            - user_id
            - must_change_password
          properties:
            access_token:
              type: string
            token_type:
              type: string
              const: Bearer
            expires_at:
              type: string
              format: date-time
            tenant_id:
              $ref: '#/components/schemas/Ulid'
            outlet_id:
              $ref: '#/components/schemas/Ulid'
            device_id:
              $ref: '#/components/schemas/Ulid'
            user_id:
              $ref: '#/components/schemas/Ulid'
            must_change_password:
              type: boolean
    PosOutletContextResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - tenant_id
            - outlet_id
            - device_id
            - user_id
          properties:
            tenant_id:
              $ref: '#/components/schemas/Ulid'
            outlet_id:
              $ref: '#/components/schemas/Ulid'
            device_id:
              $ref: '#/components/schemas/Ulid'
            user_id:
              $ref: '#/components/schemas/Ulid'
    OutletCatalogResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
              - id
              - sku
              - name
              - category
              - price_minor
              - currency
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              sku:
                type: string
              name:
                type: string
              category:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    $ref: '#/components/schemas/Ulid'
                  name:
                    type: string
              price_minor:
                type: integer
              currency:
                type: string
                minLength: 3
                maxLength: 3
    CurrentShiftResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/Shift'
            - type: 'null'
    ShiftResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Shift'
    ShiftSummaryResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ShiftSummary'
    Shift:
      type: object
      required:
