        cash_variance_minor:
          type: integer
        completed_orders_count:
          type: integer
        gross_sales_minor:
          type: integer
        recorded_payments_minor:
          type: integer
        cash_payments_minor:
          type: integer
        manual_non_cash_payments_minor:
