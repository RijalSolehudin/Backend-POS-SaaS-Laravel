openapi: 3.1.0
info:
  title: POS SaaS API
  version: 1.0.0
  description: Baseline API v1 contract for the Phase 01 Flutter POS foundation.
servers:
  - url: /api/v1
paths:
  /pos/auth/login:
    post:
      operationId: issuePosToken
      summary: Issue a POS device token
      tags:
        - POS Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - installation_id
                - outlet_id
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                installation_id:
                  $ref: '#/components/schemas/Ulid'
                outlet_id:
                  $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: POS token issued for the active user-device-outlet context.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/auth/logout:
    post:
      operationId: revokeCurrentPosToken
      summary: Revoke the current POS token
      tags:
        - POS Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current token revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: boolean
        '401':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/context:
    get:
      operationId: resolvePosOutletContext
      summary: Resolve the authenticated POS outlet context
      tags:
        - POS Context
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Active outlet context bound to the current POS token.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosOutletContextResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/catalog:
    get:
      operationId: listAvailableOutletCatalog
      summary: List available catalog products for the authenticated POS outlet
      tags:
        - POS Catalog
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Active and available products for the outlet context.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletCatalogResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/current:
    get:
      operationId: getCurrentShift
      summary: Get the current open shift for the authenticated POS user and outlet
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Current open shift, or null when no shift is open.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/open:
    post:
      operationId: openShift
      summary: Open a shift for the authenticated POS user and outlet
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - opening_cash_minor
              properties:
                opening_cash_minor:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Shift opened.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/{shift}/close:
    post:
      operationId: closeShift
      summary: Close an open shift
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: shift
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - closing_cash_minor
              properties:
                closing_cash_minor:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Shift closed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders:
    post:
      operationId: createDraftOrder
      summary: Create an idempotent draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '201':
          description: Draft order created or replayed for the same idempotency key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}:
    get:
      operationId: getDraftOrder
      summary: Get a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Draft order with item snapshots and current totals.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/items:
    post:
      operationId: addDraftOrderItem
      summary: Add an item snapshot to a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemInput'
      responses:
        '200':
          description: Draft order after item addition and total recalculation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/items/{item}:
    put:
      operationId: updateDraftOrderItem
      summary: Update an item quantity on a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: item
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: string
                  pattern: '^\d+(\.\d{1,3})?$'
      responses:
        '200':
          description: Draft order after item update and total recalculation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeDraftOrderItem
      summary: Remove an item from a draft POS order
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: item
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Draft order after item removal and total recalculation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/orders/{order}/complete:
    post:
      operationId: completeOrderWithPayment
      summary: Complete a draft POS order with exact payment
      tags:
        - POS Orders
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: order
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - amount_minor
                - currency
              properties:
                method:
                  type: string
                  enum:
                    - cash
                    - manual_non_cash
                amount_minor:
                  type: integer
                  minimum: 0
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
      responses:
        '200':
          description: Order completed with one recorded full payment, or replayed for the same idempotency key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    RequestId:
      description: Request correlation ID generated by the API or echoed from X-Request-ID.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details error response.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9a-hjkmnp-tv-z]{26}$'
    PosTokenResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - access_token
            - token_type
            - expires_at
            - tenant_id
            - outlet_id
            - device_id
            - user_id
            - must_change_password
          properties:
            access_token:
              type: string
            token_type:
              type: string
              const: Bearer
            expires_at:
              type: string
              format: date-time
            tenant_id:
              $ref: '#/components/schemas/Ulid'
            outlet_id:
              $ref: '#/components/schemas/Ulid'
            device_id:
              $ref: '#/components/schemas/Ulid'
            user_id:
              $ref: '#/components/schemas/Ulid'
            must_change_password:
              type: boolean
    PosOutletContextResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - tenant_id
            - outlet_id
            - device_id
            - user_id
          properties:
            tenant_id:
              $ref: '#/components/schemas/Ulid'
            outlet_id:
              $ref: '#/components/schemas/Ulid'
            device_id:
              $ref: '#/components/schemas/Ulid'
            user_id:
              $ref: '#/components/schemas/Ulid'
    OutletCatalogResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
              - id
              - sku
              - name
              - category
              - price_minor
              - currency
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              sku:
                type: string
              name:
                type: string
              category:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    $ref: '#/components/schemas/Ulid'
                  name:
                    type: string
              price_minor:
                type: integer
              currency:
                type: string
                minLength: 3
                maxLength: 3
    CurrentShiftResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/Shift'
            - type: 'null'
    ShiftResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Shift'
    Shift:
      type: object
      required:
        - id
        - tenant_id
        - outlet_id
        - user_id
        - status
        - opened_at
        - opening_cash_minor
        - expected_cash_minor
        - gross_sales_minor
        - currency
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        tenant_id:
          $ref: '#/components/schemas/Ulid'
        outlet_id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum:
            - open
            - closed
            - voided
        opened_at:
          type: string
          format: date-time
        closed_at:
          type:
            - string
            - 'null'
          format: date-time
        opening_cash_minor:
          type: integer
        closing_cash_minor:
          type:
            - integer
            - 'null'
        expected_cash_minor:
          type: integer
        gross_sales_minor:
          type: integer
        currency:
          type: string
          minLength: 3
          maxLength: 3
    OrderItemInput:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          $ref: '#/components/schemas/Ulid'
        quantity:
          type: string
          pattern: '^\d+(\.\d{1,3})?$'
    OrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Order'
    Order:
      type: object
      required:
        - id
        - tenant_id
        - outlet_id
        - shift_id
        - user_id
        - order_number
        - status
        - subtotal_minor
        - discount_minor
        - service_charge_minor
        - tax_minor
        - total_minor
        - currency
        - items
        - payments
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        tenant_id:
          $ref: '#/components/schemas/Ulid'
        outlet_id:
          $ref: '#/components/schemas/Ulid'
        shift_id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        order_number:
          type: string
        status:
          type: string
          enum:
            - draft
            - completed
            - cancelled
            - voided
        subtotal_minor:
          type: integer
        discount_minor:
          type: integer
        service_charge_minor:
          type: integer
        tax_minor:
          type: integer
        total_minor:
          type: integer
        currency:
          type: string
          minLength: 3
          maxLength: 3
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    OrderItem:
      type: object
      required:
        - id
        - product_id
        - product_sku
        - product_name
        - product_category_id
        - product_category_name
        - quantity
        - unit_price_minor
        - line_subtotal_minor
        - currency
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        product_id:
          $ref: '#/components/schemas/Ulid'
        product_sku:
          type: string
        product_name:
          type: string
        product_category_id:
          $ref: '#/components/schemas/Ulid'
        product_category_name:
          type: string
        quantity:
          type: string
          pattern: '^\d+(\.\d{3})$'
        unit_price_minor:
          type: integer
        line_subtotal_minor:
          type: integer
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Payment:
      type: object
      required:
        - id
        - method
        - status
        - amount_minor
        - currency
        - recorded_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        method:
          type: string
          enum:
            - cash
            - manual_non_cash
        status:
          type: string
          enum:
            - recorded
            - voided
        amount_minor:
          type: integer
        currency:
          type: string
          minLength: 3
          maxLength: 3
        recorded_at:
          type: string
          format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - trace_id
        - retryable
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        trace_id:
          type: string
        retryable:
          type: boolean
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - code
              - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
