        resource_type:
          type:
            - string
            - 'null'
        resource_id:
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
        payload:
          type:
            - object
            - 'null'
          additionalProperties: true
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - trace_id
        - retryable
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        trace_id:
          type: string
        retryable:
          type: boolean
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - code
              - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
