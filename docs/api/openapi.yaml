openapi: 3.1.0
info:
  title: POS SaaS API
  version: 1.0.0
  description: Baseline API v1 contract for the Phase 01 Flutter POS foundation.
servers:
  - url: /api/v1
paths:
  /pos/auth/login:
    post:
      operationId: issuePosToken
      summary: Issue a POS device token
      tags:
        - POS Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - installation_id
                - outlet_id
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                installation_id:
                  $ref: '#/components/schemas/Ulid'
                outlet_id:
                  $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: POS token issued for the active user-device-outlet context.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosTokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/auth/logout:
    post:
      operationId: revokeCurrentPosToken
      summary: Revoke the current POS token
      tags:
        - POS Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current token revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - revoked
                    properties:
                      revoked:
                        type: boolean
        '401':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/context:
    get:
      operationId: resolvePosOutletContext
      summary: Resolve the authenticated POS outlet context
      tags:
        - POS Context
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Active outlet context bound to the current POS token.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosOutletContextResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/catalog:
    get:
      operationId: listAvailableOutletCatalog
      summary: List available catalog products for the authenticated POS outlet
      tags:
        - POS Catalog
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Active and available products for the outlet context.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletCatalogResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/current:
    get:
      operationId: getCurrentShift
      summary: Get the current open shift for the authenticated POS user and outlet
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Current open shift, or null when no shift is open.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/open:
    post:
      operationId: openShift
      summary: Open a shift for the authenticated POS user and outlet
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - opening_cash_minor
              properties:
                opening_cash_minor:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Shift opened.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /pos/outlets/{outlet}/shifts/{shift}/close:
    post:
      operationId: closeShift
      summary: Close an open shift
      tags:
        - POS Shifts
      security:
        - bearerAuth: []
      parameters:
        - name: outlet
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
        - name: shift
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - closing_cash_minor
              properties:
                closing_cash_minor:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Shift closed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    RequestId:
      description: Request correlation ID generated by the API or echoed from X-Request-ID.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details error response.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9a-hjkmnp-tv-z]{26}$'
    PosTokenResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - access_token
            - token_type
            - expires_at
            - tenant_id
            - outlet_id
            - device_id
            - user_id
            - must_change_password
          properties:
            access_token:
              type: string
            token_type:
              type: string
              const: Bearer
            expires_at:
              type: string
              format: date-time
            tenant_id:
              $ref: '#/components/schemas/Ulid'
            outlet_id:
              $ref: '#/components/schemas/Ulid'
            device_id:
              $ref: '#/components/schemas/Ulid'
            user_id:
              $ref: '#/components/schemas/Ulid'
            must_change_password:
              type: boolean
    PosOutletContextResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - tenant_id
            - outlet_id
            - device_id
            - user_id
          properties:
            tenant_id:
              $ref: '#/components/schemas/Ulid'
            outlet_id:
              $ref: '#/components/schemas/Ulid'
            device_id:
              $ref: '#/components/schemas/Ulid'
            user_id:
              $ref: '#/components/schemas/Ulid'
    OutletCatalogResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
              - id
              - sku
              - name
              - category
              - price_minor
              - currency
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              sku:
                type: string
              name:
                type: string
              category:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    $ref: '#/components/schemas/Ulid'
                  name:
                    type: string
              price_minor:
                type: integer
              currency:
                type: string
                minLength: 3
                maxLength: 3
    CurrentShiftResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/Shift'
            - type: 'null'
    ShiftResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Shift'
    Shift:
      type: object
      required:
        - id
        - tenant_id
        - outlet_id
        - user_id
        - status
        - opened_at
        - opening_cash_minor
        - expected_cash_minor
        - gross_sales_minor
        - currency
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        tenant_id:
          $ref: '#/components/schemas/Ulid'
        outlet_id:
          $ref: '#/components/schemas/Ulid'
        user_id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum:
            - open
            - closed
            - voided
        opened_at:
          type: string
          format: date-time
        closed_at:
          type:
            - string
            - 'null'
          format: date-time
        opening_cash_minor:
          type: integer
        closing_cash_minor:
          type:
            - integer
            - 'null'
        expected_cash_minor:
          type: integer
        gross_sales_minor:
          type: integer
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - trace_id
        - retryable
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        trace_id:
          type: string
        retryable:
          type: boolean
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - code
              - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
