                      name:
                        type: string
                      category_id:
                        $ref: '#/components/schemas/Ulid'
                      category_name:
                        type: string
                      quantity:
                        type: string
                      unit_price_minor:
                        type: integer
                      line_subtotal_minor:
                        type: integer
                      currency:
                        type: string
